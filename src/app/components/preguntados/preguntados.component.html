<app-header></app-header>

<div class="container-games">

    <app-chat class="chat-screen"></app-chat>

    <div class="game-screen"
    [style.pointer-events]=" (this.canPlay) ? 'auto' : 'none' ">

    <div id="title-container">
        <h1>¿Cuál es este Pokémon?</h1>
    </div>

    <div id="pokemon-image-container">
        <img id="pokemon-sprite" src="{{this.pokemonImage}}">
    </div>

    <div id="lives-container">
        <h1>Vidas</h1>
        @if (this.lives > 2 ) 
                {
                    <img class="heart" src="heart.png">
                }
                @if (this.lives > 1) 
                {
                    <img class="heart" src="heart.png">
                }
                @if (this.lives > 0) 
                {
                    <img class="heart" src="heart.png">
                }
    </div>

    <div id="score-container">
        <h1>Puntaje</h1>
        <h2>100</h2>
        <button mat-flat-button>Rendirse</button>
    </div>

    <div id="option1-container">
        <button mat-flat-button
        id="option1-button">{{this.pokemonNames[0]}}</button>
    </div>

    <div id="option2-container">                
            <button mat-flat-button
            id="option2-button">{{this.pokemonNames[1]}}</button>
    </div>

    <div id="option3-container">
        <button mat-flat-button
        id="option3-button">{{this.pokemonNames[2]}}</button>
    </div>

    <div id="option4-container">
        <button mat-flat-button
        id="option4-button">{{this.pokemonNames[3]}}</button>
    </div>

    </div>
</div>
