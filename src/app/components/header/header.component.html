<div>
    <ul>
        <img style="float: left;" src="icon.png" alt="logo" class="logo">
        <li><h1>{{mensajeBienvenida}}</h1></li>
        @if (this.ingreso)
        {
            <li style="float:right"><button (click)="logOut()">Salir</button></li>
        } @else
        {
            <li style="float:right"><button (click)="goToLogin()">Ingresar</button></li>
            <li style="float:right"><button (click)="goToRegister()">Registrarse</button></li>
        }
    </ul> 
</div>
